<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset your password · VEGArance</title>
<link rel="stylesheet" href="platform.css">
<link rel="stylesheet" href="design-system.css">
</head>
<body class="ds-app">
<a class="ds-skip-link" href="#resetMain">Skip to password reset</a>
<header><a href="platform.html" class="wordmark">VEGArance <span>for merchants</span></a></header>
<main id="resetMain">
<h1>Reset your password</h1>
<p id="resetStatus" role="status" aria-live="polite"></p>
<form id="resetForm" class="panel">
<div class="ds-field"><label class="ds-label">New password<input class="ds-input" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label></div>
<p class="ds-hint">Use at least 12 characters. Resetting signs you out everywhere.</p>
<button class="ds-btn" type="submit">Reset password</button>
</form>
<p><a href="onboarding.html">Back to setup</a></p>
</main>
<script>
(function () {
  var token = new URLSearchParams(location.search).get('token');
  var status = document.getElementById('resetStatus');
  var form = document.getElementById('resetForm');
  if (!token) { status.textContent = 'This link is missing its reset token. Request a new one from the merchant dashboard.'; status.className = 'ds-alert ds-alert-danger'; form.hidden = true; return; }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = form.querySelector('button'); btn.disabled = true;
    fetch('/api/platform/reset-password', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token, password: form.elements.password.value }) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || ('Reset failed (' + r.status + ')')); return d; }); })
      .then(function () { status.textContent = 'Your password was reset. Sign in with your new password.'; status.className = 'ds-alert ds-alert-success'; form.hidden = true; })
      .catch(function (err) { status.textContent = err.message; status.className = 'ds-alert ds-alert-danger'; btn.disabled = false; });
  });
})();
</script>
</body>
</html>
